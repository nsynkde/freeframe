# ============================================================
# FreeFrame — Dev Pipeline
# Triggers on push to the 'dev' branch.
# Builds and pushes :dev-tagged images to the private registry.
# Watchtower on the dev server picks up the new images.
#
# Required Woodpecker secrets (set in project settings):
#   registry_username  — registry login username
#   registry_password  — registry login password/token
#
# Before first use: replace REGISTRY below with your registry host.
# ============================================================

# CHANGE THIS to your private registry hostname
# e.g. registry.nsynk.de
x-registry: &registry registry.example.com

when:
  - branch: dev
    event: push

steps:
  - name: build-push-api
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: *registry
      repo: *registry/freeframe/api
      tags:
        - dev
      dockerfile: apps/api/Dockerfile.prod
      # Root context — API copies from apps/api and packages/transcoder
      context: .
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password

  - name: build-push-web
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: *registry
      repo: *registry/freeframe/web
      tags:
        - dev
      dockerfile: apps/web/Dockerfile.prod
      context: apps/web
      build_args:
        - NEXT_PUBLIC_API_URL=/api
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
